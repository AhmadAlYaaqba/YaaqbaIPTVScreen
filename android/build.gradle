buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 26
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
        useExoplayerIMA = false
        useExoplayerRtsp = true
        useExoplayerSmoothStreaming = true
        useExoplayerDash = true
        useExoplayerHls = true
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Force stable androidx.core to avoid requiring AGP 8.9.1+
// (react-native-video 6.19 pulls in 1.18.0-rc01 which needs compileSdk 36 + AGP 8.9.1)
subprojects {
    configurations.all {
        resolutionStrategy.force 'androidx.core:core:1.15.0'
        resolutionStrategy.force 'androidx.core:core-ktx:1.15.0'
    }
}
